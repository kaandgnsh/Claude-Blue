name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: greet
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "Title: $TITLE"
