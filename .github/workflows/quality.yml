name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Optional test dependencies (YARA, Sigma, tshark, nftables, OpenSSH)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark nftables openssh-server iproute2 util-linux
          python -m pip install yara-python sigma-cli pysigma-backend-splunk
      - name: Allow unprivileged user namespaces (firewall tests run in isolated netns)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: python tools/claude_blue.py validate
      - run: python -m compileall -q tools tests skills
      - run: python -m unittest discover -s tests -v
      - name: Embedded scripts audit their own workflows
        run: python skills/devsecops/github-actions-hardening/scripts/gha_audit.py .github/workflows
