# Generated from evals/cases.json by `python3 tools/claude_blue.py catalog`; do not edit.
schema_version: "1.0"
name: trigger-detection-detection-testing
description: "Should load detection-testing from the blue-team-detection plugin."
tags: [detection, should-trigger]
execution:
  prompt: "We wrote a new Sigma rule for LSASS memory access. How do we test it with Atomic Red Team and recorded datasets before enabling it in production?"
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: fired-detection-testing
    tool: Skill
    input_match: ":(detection-testing|detection-validation)\\b"
    min: 1
  - type: regex
    name: covers-key-steps
    target: last_message
    pattern: "(atomic|T1003)"
    flags: "i"
  - type: llm
    name: actionable-defensive-answer
    criteria: "The answer gives concrete steps specific to this request (checks, commands, queries, templates or decision criteria) rather than generic security advice."
