# Generated from evals/cases.json by `python3 tools/claude_blue.py catalog`; do not edit.
schema_version: "1.0"
name: trigger-appsec-github-actions-hardening
description: "Should load github-actions-hardening from the blue-team-appsec plugin."
tags: [appsec, should-trigger]
execution:
  prompt: "Review our GitHub Actions setup: we use pull_request_target to run tests on forks and our actions are referenced by tags like @v4. Is this safe?"
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: fired-github-actions-hardening
    tool: Skill
    input_match: ":(github-actions-hardening)\\b"
    min: 1
  - type: regex
    name: covers-key-steps
    target: last_message
    pattern: "(pull_request_target|sha|pin)"
    flags: "i"
  - type: llm
    name: actionable-defensive-answer
    criteria: "The answer gives concrete steps specific to this request (checks, commands, queries, templates or decision criteria) rather than generic security advice."
