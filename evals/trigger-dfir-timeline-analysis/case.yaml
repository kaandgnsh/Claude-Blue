# Generated from evals/cases.json by `python3 tools/claude_blue.py catalog`; do not edit.
schema_version: "1.0"
name: trigger-dfir-timeline-analysis
description: "Should load timeline-analysis from the blue-team-dfir plugin."
tags: [dfir, should-trigger]
execution:
  prompt: "I have EDR process events as CSV and CloudTrail JSON for the same incident. Help me merge them into a single UTC timeline so I can see the order of events."
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: fired-timeline-analysis
    tool: Skill
    input_match: ":(timeline-analysis)\\b"
    min: 1
  - type: regex
    name: covers-key-steps
    target: last_message
    pattern: "(utc|timeline)"
    flags: "i"
  - type: llm
    name: actionable-defensive-answer
    criteria: "The answer gives concrete steps specific to this request (checks, commands, queries, templates or decision criteria) rather than generic security advice."
