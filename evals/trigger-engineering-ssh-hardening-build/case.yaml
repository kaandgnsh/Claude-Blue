# Generated from evals/cases.json by `python3 tools/claude_blue.py catalog`; do not edit.
schema_version: "1.0"
name: trigger-engineering-ssh-hardening-build
description: "Should load ssh-hardening-build from the blue-team-engineering plugin."
tags: [engineering, should-trigger]
execution:
  prompt: "Give me a hardened sshd configuration for our Linux servers with modern key exchange algorithms, and tell me how to test that weak clients are rejected."
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: fired-ssh-hardening-build
    tool: Skill
    input_match: ":(ssh-hardening-build)\\b"
    min: 1
  - type: regex
    name: covers-key-steps
    target: last_message
    pattern: "(kex|sshd|ciphers)"
    flags: "i"
  - type: llm
    name: actionable-defensive-answer
    criteria: "The answer gives concrete steps specific to this request (checks, commands, queries, templates or decision criteria) rather than generic security advice."
