# Generated from evals/cases.json by `python3 tools/claude_blue.py catalog`; do not edit.
schema_version: "1.0"
name: trigger-cloud-aws-credential-compromise
description: "Should load aws-credential-compromise from the blue-team-cloud plugin."
tags: [cloud, should-trigger]
execution:
  prompt: "GitHub secret scanning told us an AWS access key AKIA... was pushed to a public repo an hour ago. What do we do right now and how do we scope what the key did?"
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: fired-aws-credential-compromise
    tool: Skill
    input_match: ":(aws-credential-compromise|cloudtrail-investigation)\\b"
    min: 1
  - type: regex
    name: covers-key-steps
    target: last_message
    pattern: "(cloudtrail|deactivate|rotate)"
    flags: "i"
  - type: llm
    name: actionable-defensive-answer
    criteria: "The answer gives concrete steps specific to this request (checks, commands, queries, templates or decision criteria) rather than generic security advice."
